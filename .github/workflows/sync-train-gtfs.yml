name: Sync train GTFS schedule

on:
  # Pre-merge gate: download, hash, and build without touching Supabase.
  pull_request:
    branches: [main]
    paths:
      - "busai/scripts/gtfs/**"
      - "busai/supabase/migrations/**"
      - ".github/workflows/sync-train-gtfs.yml"
  # Real import after a pipeline change lands on main.
  push:
    branches: [main]
    paths:
      - "busai/scripts/gtfs/**"
      - "busai/supabase/migrations/**"
      - ".github/workflows/sync-train-gtfs.yml"
  # Daily 04:00 SGT.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Download, hash, and build without importing
        type: boolean
        default: false

concurrency:
  group: sync-train-gtfs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Fork PRs do not receive repository secrets; skip them safely.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Test sync
        working-directory: busai/scripts/gtfs
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Sync
        env:
          LTA_DATAMALL_KEY: ${{ secrets.LTA_DATAMALL_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || (github.event.inputs.dry_run == 'true' && '1' || '0') }}
        run: python busai/scripts/gtfs/sync.py

      - name: Upload compact CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-gtfs-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/gtfs-snapshot/*.csv
          retention-days: 7
          if-no-files-found: warn

      - name: Verify sync state
        if: success() && github.event_name != 'pull_request'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
          do \$\$
          declare
            checked timestamptz;
            err text;
          begin
            select last_checked_at, last_error
              into checked, err
              from public.train_gtfs_meta
             where id = 1;

            if checked is null or checked < now() - interval '48 hours' then
              raise exception 'train GTFS metadata is stale';
            end if;
            if err is not null then
              raise exception 'train GTFS last_error: %', err;
            end if;
          end
          \$\$;
          "

      - name: Heartbeat
        if: success() && github.event_name != 'pull_request'
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -n "$HEALTHCHECK_PING_URL" ]; then
            curl -fsS --max-time 10 "$HEALTHCHECK_PING_URL"
          fi
